[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-tui"
version = "0.1.0"
description = "A keyboard-first Telegram terminal client built with Textual and Telethon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "textual>=6.0,<7",
  "Telethon>=1.40,<2",
  "python-socks[asyncio]>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11"]

[project.scripts]
telegram-tui = "telegram_tui.__main__:main"
tg = "telegram_tui.__main__:main"
tele = "telegram_tui.__main__:main"

[project.urls]
Repository = "https://github.com/12202106/telegram-tui-linux"
Issues = "https://github.com/12202106/telegram-tui-linux/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
